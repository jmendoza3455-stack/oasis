name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Versión fija: el 19/10/2026 GitHub empezó a mover ubuntu-latest a Ubuntu 26 y Chrome dejó de
    # arrancar para Lighthouse. Se actualiza a propósito, no por sorpresa.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://oasis_app:oasis_local@localhost:5432/oasis_dev
      OASIS_DEV_AUTH: "1"
      OASIS_AGENT_FAKE: "1"
      OASIS_WHATSAPP_FAKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: ffmpeg (motor de Reels del equipo de marketing)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Unit tests + cobertura del dominio (≥90 %)
        run: pnpm test:coverage
      - name: BD (migraciones, RLS, constraints, seed)
        run: pnpm test:db
      - name: BD local para el build (las páginas públicas leen settings con caché)
        run: pnpm db:local
      - name: Build
        run: pnpm build
      - name: E2E (BD local recreada en global-setup)
        run: pnpm test:e2e
      - name: Lighthouse móvil (web pública)
        env:
          LH_MIN_PERF: "85"
          LH_MAX_LCP: "3500"
        run: |
          # El mismo Chromium que usan las pruebas E2E (instalado arriba por Playwright)
          export CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          PORT=3100 pnpm start &
          npx --yes wait-on http://localhost:3100 --timeout 60000
          pnpm lighthouse
      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.sha }}
          path: |
            playwright-report
            test-results
          retention-days: 14
